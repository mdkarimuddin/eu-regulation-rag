[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-regulation-rag"
version = "0.1.0"
description = "RAG over the EU AI Act and GDPR with cited answers, hybrid retrieval and a measured evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "llm-eval-harness @ git+https://github.com/mdkarimuddin/llm-eval-harness.git@main",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
anthropic = ["anthropic>=0.40"]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
eurag = "eurag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["pg: needs a running Postgres with pgvector (set EURAG_PG_DSN)"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/eurag/api.py" = ["E501"]
