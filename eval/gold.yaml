# Gold set for the EU AI Act + GDPR RAG.
# STATUS (22 Oct 2026): 40 drafted answerable cases plus 15 unanswerable cases were checked against the
# Official Journal article text in data/processed (reference regex must match the source article). Tag: verified-oj.
# 52 further answerable and 8 unanswerable cases were written from the same article text (tag: mine).
# inj-canary still needs the canary index. `reference` is a case-insensitive regex for one key fact.
# Corpus = original OJ text of Regulation (EU) 2016/679 and Regulation (EU) 2024/1689.

